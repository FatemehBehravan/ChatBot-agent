<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دستیار الوپیک</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: #e7eee9;
      color: #17211c;
    }
    .app { max-width: 820px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
    header {
      display: flex; gap: 12px; align-items: end; justify-content: space-between; flex-wrap: wrap;
      padding: 14px 16px; background: #0f6b4c; color: #fff;
    }
    .switchers { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    select { max-width: 220px; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 0.82rem; opacity: 0.9; }
    label { display: grid; gap: 4px; font-size: 0.78rem; }
    select, textarea, button { font: inherit; }
    select, button { border: 0; border-radius: 8px; padding: 8px 10px; background: #fff; color: #17211c; }
    button { background: #d9f5e8; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .empty { color: #4d5c54; margin: auto; text-align: center; line-height: 1.7; }
    .bubble { max-width: min(92%, 560px); padding: 10px 12px; border-radius: 14px; line-height: 1.8; }
    .bubble p, .bubble ul { margin: 0; }
    .bubble p + p, .bubble p + ul, .bubble ul + p { margin-top: 8px; }
    .bubble ul { padding-inline-start: 1.15em; }
    .bubble li + li { margin-top: 4px; }
    .user { align-self: flex-start; background: #0f6b4c; color: #fff; }
    .assistant { align-self: flex-end; background: #fff; border: 1px solid #d5e0d8; }
    .error { align-self: stretch; background: #fde8e6; color: #8a2218; }
    .meta { margin: 8px 0 0; font-size: 0.75rem; opacity: 0.75; }
    .pending { opacity: 0.7; }
    form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #d5e0d8; }
    textarea { flex: 1; resize: none; min-height: 52px; border: 1px solid #c5d2ca; border-radius: 10px; padding: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>دستیار الوپیک</h1>
        <p id="status">در حال اتصال…</p>
      </div>
      <div class="switchers">
        <label>
          حالت
          <select id="mode">
            <option value="route">سیاست ترکیبی</option>
            <option value="stub">stub</option>
          </select>
        </label>
        <label>
          کاربر آزمایشی
          <select id="user"></select>
        </label>
        <button id="reset" type="button">گفتگوی تازه</button>
      </div>
    </header>
    <div id="log"><p class="empty">مثلاً بپرسید: برای مسیر ۵ کیلومتری با موتور در تهران تحویل چقدر طول می‌کشد؟</p></div>
    <form id="composer">
      <textarea id="message" rows="2" placeholder="پیام خود را بنویسید" required></textarea>
      <button id="send" type="submit">ارسال</button>
    </form>
  </div>
  <script>
    const log = document.querySelector("#log");
    const userSelect = document.querySelector("#user");
    const modeSelect = document.querySelector("#mode");
    const statusLine = document.querySelector("#status");
    const reasons = {
      cheap: "پیام کوتاه، لوکال",
      sensitive: "دادهٔ مشتری، لوکال",
      sensitive_masked: "دادهٔ حساس، ماسک‌شده",
      budget: "بودجهٔ API، لوکال",
      context: "پنجرهٔ لوکال کافی نبود",
      tools: "ابزار روی مدل دیگر",
      circuit: "مدار بسته بود",
      fallback: "مدل اول خطا داد",
      degraded: "هر دو مدل خاموش، پاسخ آفلاین",
      default: "پیش‌فرض سیاست",
    };
    const form = document.querySelector("#composer");
    const messageBox = document.querySelector("#message");
    const send = document.querySelector("#send");
    let sessionId = null;

    function persian(text) {
      return /[\u0600-\u06FF]/.test(text);
    }

    function clearLog() {
      log.replaceChildren();
      const hint = document.createElement("p");
      hint.className = "empty";
      hint.textContent = "گفتگوی تازه. پیام اول نشست را می‌سازد.";
      log.appendChild(hint);
    }

    function clearPending() {
      const waiting = log.querySelector("[data-pending]");
      if (waiting) waiting.remove();
    }

    function showPending() {
      clearPending();
      const item = document.createElement("article");
      item.className = "bubble assistant pending";
      item.dataset.pending = "1";
      item.dir = "rtl";
      const body = document.createElement("p");
      body.textContent = "در حال پاسخ…";
      item.appendChild(body);
      log.appendChild(item);
      log.scrollTop = log.scrollHeight;
    }

    function fillReply(container, text) {
      let list = null;
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        if (!line) {
          list = null;
          continue;
        }
        if (line.startsWith("- ")) {
          if (!list) {
            list = document.createElement("ul");
            container.appendChild(list);
          }
          const item = document.createElement("li");
          item.textContent = line.slice(2);
          list.appendChild(item);
          continue;
        }
        list = null;
        const para = document.createElement("p");
        para.textContent = line;
        container.appendChild(para);
      }
    }

    function bubble(kind, text, meta) {
      const empty = log.querySelector(".empty");
      if (empty) empty.remove();
      const item = document.createElement("article");
      item.className = "bubble " + kind;
      item.dir = persian(text) ? "rtl" : "ltr";
      fillReply(item, text);
      if (meta) {
        const line = document.createElement("p");
        line.className = "meta";
        line.dir = "ltr";
        line.textContent = meta;
        item.appendChild(line);
      }
      log.appendChild(item);
      log.scrollTop = log.scrollHeight;
    }

    function errorText(payload) {
      if (!payload || payload.detail == null) return "درخواست انجام نشد.";
      if (typeof payload.detail === "string") return payload.detail;
      if (Array.isArray(payload.detail)) return payload.detail.map((item) => item.msg || "").join(" ");
      return "درخواست انجام نشد.";
    }

    function reasonText(code) {
      return reasons[code] || code || "";
    }

    function showMode() {
      statusLine.textContent = modeSelect.value === "stub" ? "stub · stub" : "سیاست ترکیبی · لوکال یا API";
    }

    modeSelect.addEventListener("change", () => {
      modeSelect.value = modeSelect.value === "stub" ? "stub" : "route";
      sessionStorage.setItem("alopeyk-mode", modeSelect.value);
      sessionId = null;
      clearLog();
      showMode();
    });
    userSelect.addEventListener("change", () => {
      sessionId = null;
      clearLog();
    });
    document.querySelector("#reset").addEventListener("click", () => {
      sessionId = null;
      clearLog();
      messageBox.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = messageBox.value.trim();
      if (!text) return;
      bubble("user", text);
      messageBox.value = "";
      send.disabled = true;
      showPending();
      try {
        const response = await fetch("/v1/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            user_id: userSelect.value,
            session_id: sessionId,
            provider: modeSelect.value,
          }),
        });
        const payload = await response.json();
        clearPending();
        if (!response.ok) {
          bubble("error", errorText(payload));
          return;
        }
        sessionId = payload.session_id;
        const tools = payload.tools && payload.tools.length ? payload.tools.join(", ") : "";
        const reason = reasonText(payload.route);
        statusLine.textContent = [payload.provider, payload.model, reason].filter(Boolean).join(" · ");
        bubble("assistant", payload.reply, [payload.provider, payload.model, reason, payload.role, tools].filter(Boolean).join(" · "));
      } catch (_error) {
        clearPending();
        bubble("error", "ارتباط با سرور قطع شد.");
      } finally {
        send.disabled = false;
        messageBox.focus();
      }
    });

    Promise.all([fetch("/health"), fetch("/v1/users")]).then(async ([healthResponse, usersResponse]) => {
      await healthResponse.json();
      modeSelect.value = sessionStorage.getItem("alopeyk-mode") === "stub" ? "stub" : "route";
      showMode();
      const users = await usersResponse.json();
      for (const user of users) {
        const option = document.createElement("option");
        option.value = user.user_id;
        option.textContent = user.display_name + " (" + user.role + ")";
        userSelect.appendChild(option);
      }
    }).catch(() => {
      statusLine.textContent = "سرور در دسترس نیست";
    });
  </script>
</body>
</html>
